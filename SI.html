    `数值为整数原始值，未经四舍五入；品种上市晚，历史自首个有仓单交易日起。<br>`+
    `<b>强制注销规则：</b>${D.rule}。${D.detail}。`+
    `图底部 ◆ 为数据中仓单实际清零（单日降幅≥95%）的日期；● 为规则外的大额自愿注销。`+
    (D.cancelMonths.length?`主图琥珀色竖带为规则注销月份（${D.cancelMonths.join(' / ')} 月）。`:'该品种无固定注销月份，不加竖带。');
}

function buildYearChips(){
  const ys = yearList();
  if(!curY || !ys.includes(curY)) curY = ys[ys.length-1];
  const el = document.getElementById('years');
  el.innerHTML = '<span class="lab">高亮年份</span>' + ys.map(y=>
    `<button class="ychip${y===curY?' on':''}" data-y="${y}">${y}${y===ys[ys.length-1]?' · 今年':''}</button>`).join('');
  el.querySelectorAll('.ychip').forEach(b=>b.onclick=()=>{curY=b.dataset.y; render();});
}

function render(){
  const ys = yearList();
  buildYearChips();

  const bandData = D.cancelMonths.map(mm=>{
    const m2 = String(mm).padStart(2,'0');
    const endDay = {'01':31,'02':29,'03':31,'04':30,'05':31,'06':30,'07':31,'08':31,'09':30,'10':31,'11':30,'12':31}[m2];
    return [{xAxis:m2+'-01', itemStyle:{color:'rgba(180,83,9,0.07)'}}, {xAxis:m2+'-'+endDay}];
  });

  const lineSeries = ys.map((y,i)=>{
    const map = D.years[y];
    const data = LABELS.map(l=> map[l] ? map[l][0] : null);
    const hl = y===curY;
    return {
      name:y, type:'line', xAxisIndex:0, yAxisIndex:0, data,
      connectNulls:true, showSymbol:false, smooth:false,
      lineStyle:{width: hl?2.6:1.1, color: hl?'#c2402a':GREYS[i%GREYS.length], opacity: hl?1:.85},
      emphasis:{focus:'series'},
      z: hl?10:2,
      markArea: hl && bandData.length ? {silent:true, label:{show:false}, data:bandData} : undefined,
      markPoint: hl ? {
        symbol:'pin', symbolSize:34,
        itemStyle:{color:'#b45309'},
        label:{fontSize:9, color:'#fff', formatter:'注销'},
        data: D.cancels.filter(c=>c.date.startsWith(y)).map(c=>({coord:[c.date.slice(5), 0], value:0}))
      } : undefined
    };
  });

  const cmap = D.years[curY]||{};
  const absMax = Math.max(1, ...LABELS.map(l=> cmap[l]&&cmap[l][1]!=null ? Math.abs(cmap[l][1]) : 0));
  const labelTh = absMax*0.28;
  const barData = LABELS.map(l=>{
    const rec = cmap[l];
    if(!rec || rec[1]==null) return null;
    const v = rec[1];
    return { value:v,
      itemStyle:{color: v>0?'#c2402a':(v<0?'#256b4a':'#bbb3a2')},
      label:{show: Math.abs(v)>=labelTh, position: v>0?'top':'bottom', fontSize:9,
             color: v>0?'#c2402a':'#256b4a', formatter:()=>fmtC(v)} };
  });
  const barSeries = { name:curY+' 日变动', type:'bar', xAxisIndex:1, yAxisIndex:1, data:barData, barWidth:'62%' };

  const rowNames = ['自愿', ...ys.slice().reverse()];
  const canPts = D.cancels.map(c=>({
    value:[c.date.slice(5), c.date.slice(0,4)],
    date:c.date, chg:c.chg, prev:c.prev,
    label:{show:true, position:'right', distance:5, fontSize:9, color:'#b45309', formatter:()=>c.date.slice(5)}
  }));
  const dropPts = D.drops.map(p=>({value:[p.date.slice(5),'自愿'], date:p.date, chg:p.chg, pct:p.pct}));
  const canSeries = { name:'仓单清零日', type:'scatter', xAxisIndex:2, yAxisIndex:2,
    data:canPts, symbol:'diamond', symbolSize:11, itemStyle:{color:'#b45309'}, z:5,
    tooltip:{formatter:p=>`${p.data.date}<br>仓单清零（强制注销窗口）<br>前一日仓单 ${fmt(p.data.prev)} → 0（${fmtC(p.data.chg)}）`} };
  const dropSeries = { name:'大额自愿注销', type:'scatter', xAxisIndex:2, yAxisIndex:2,
    data:dropPts, symbol:'circle', symbolSize:5, itemStyle:{color:'#9a917f', opacity:.8},
    tooltip:{formatter:p=>`${p.data.date}<br>大额自愿注销 ${fmtC(p.data.chg)}（${p.data.pct}%）`} };

  const monAxis = { type:'category', data:LABELS, boundaryGap:false,
    axisLine:{lineStyle:{color:'#ddd6c4'}}, axisTick:{show:false},
    axisLabel:{fontSize:9, color:'#9a917f', fontFamily:'JetBrains Mono, monospace',
               interval:(i,v)=> v.endsWith('-01'), formatter:v=> (parseInt(v.slice(0,2))+'月')} };

  chart.setOption({
    animationDuration:400,
    grid:[
      {left:70,right:20,top:34,height:'43%'},
      {left:70,right:20,top:'56%',height:'17%'},
      {left:70,right:20,top:'79%',height:'17%'}
    ],
    axisPointer:{link:[{xAxisIndex:'all'}], label:{backgroundColor:'#6e675c'}},
    tooltip:[
      {trigger:'axis', confine:true, backgroundColor:'#211d19', borderWidth:0,
       textStyle:{color:'#f5f3ec', fontSize:11, fontFamily:'JetBrains Mono, monospace'},
       formatter:(ps)=>{
         const rows = ps.filter(p=>p.seriesType==='line' && p.value!=null);
         if(!rows.length) return '';
         let h = '<b>'+ps[0].axisValue+'</b><br>';
         rows.sort((a,b)=>b.seriesName-a.seriesName).forEach(p=>{
           const y=p.seriesName, rec=(D.years[y]||{})[p.axisValue];
           const chg = rec? rec[1]:null;
           h += `<span style="display:inline-block;width:8px;height:8px;background:${p.color};margin-right:6px"></span>`+
                `${y}: <b>${fmt(p.value)}</b> <span style="opacity:.75">(${fmtC(chg)})</span><br>`;
         });
         return h + '<span style="opacity:.6">单位：'+D.unit+'</span>';
       }},
      {trigger:'item', confine:true, backgroundColor:'#211d19', borderWidth:0,
       textStyle:{color:'#f5f3ec', fontSize:11, fontFamily:'JetBrains Mono, monospace'}}
    ],
    xAxis:[
      {...monAxis, gridIndex:0, axisLabel:{...monAxis.axisLabel, show:true}},
      {...monAxis, gridIndex:1, axisLabel:{show:false}},
      {...monAxis, gridIndex:2, boundaryGap:true, axisLabel:{...monAxis.axisLabel, show:true}}
    ],
    yAxis:[
      {gridIndex:0, type:'value', name:'仓单（'+D.unit+'）', nameTextStyle:{fontSize:10,color:'#9a917f'},
       splitLine:{lineStyle:{color:'#e8e2d2'}}, axisLabel:{fontSize:10,color:'#6e675c',formatter:v=>v.toLocaleString()}},
      {gridIndex:1, type:'value', name:'日变动', nameTextStyle:{fontSize:10,color:'#9a917f'},
       splitLine:{lineStyle:{color:'#e8e2d2'}}, axisLabel:{fontSize:10,color:'#6e675c',formatter:v=>fmtC(v)},
       splitNumber:3},
      {gridIndex:2, type:'category', data:rowNames, axisLine:{show:false}, axisTick:{show:false},
       axisLabel:{fontSize:9, color:'#9a917f'}, splitLine:{show:false}}
    ],
    series:[...lineSeries, barSeries, canSeries, dropSeries]
  }, {replaceMerge:['series','xAxis','yAxis','grid','tooltip']});
}

buildMeta(); render();
window.addEventListener('resize', ()=>chart.resize());
</script>
</body>
</html>
